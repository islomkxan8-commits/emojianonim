<style>

.stage{position:relative;width:min(100%,300px);aspect-ratio:1;margin:12px auto 16px;border-radius:28px;border:2px solid transparent;background:radial-gradient(circle at 30% 20%,#25252b,#050507) padding-box,conic-gradient(from var(--a),var(--ac),#fff,#333,var(--ac)) border-box;animation:spin 5s linear infinite;box-shadow:0 0 50px #9b8cff26;display:grid;gap:4px;padding:10px;place-items:center;color:var(--hint);text-align:center;font-size:13px;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));overflow:hidden}

label{display:block;margin:14px 0 6px;color:var(--hint);font-size:13px}

.sub{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}

.go:active{transform:scale(.96)}.go:disabled{opacity:.5}.price{text-align:center;margin-top:12px;color:var(--hint)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stats.k4{grid-template-columns:repeat(4,1fr)}.stats div{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px 4px;text-align:center}.stats b{display:block;font-size:21px;color:var(--ac)}

.dots{display:flex;gap:8px;margin:12px 0}.dots i{flex:1;height:10px;border-radius:9px;background:var(--s2);transition:.4s}.dots i.on{background:var(--ac);box-shadow:0 0 14px var(--ac)}

nav button span{display:none}nav button.on span{display:inline}nav button b{font-size:17px}.lb .btn2{flex:none;padding:6px 12px}
.dust{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--ac);opacity:0;animation:up linear infinite}
@keyframes up{10%{opacity:.7}to{transform:translateY(-105vh) translateX(var(--dx));opacity:0}}
.rip{position:absolute;border-radius:50%;background:#9b8cff55;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
.lb{animation:in .4s both}.lb:nth-child(2){animation-delay:.05s}.lb:nth-child(3){animation-delay:.1s}.lb:nth-child(4){animation-delay:.15s}.lb:nth-child(5){animation-delay:.2s}.lb:nth-child(6){animation-delay:.25s}.lb.me2{background:#9b8cff14;border-radius:10px}
.stage,.prize{transition:transform .15s ease-out;will-change:transform}
.prize{position:relative;margin-top:14px;text-align:center;padding:18px 14px;border-radius:22px;border:2px solid transparent;background:linear-gradient(var(--s1),var(--s1)) padding-box,conic-gradient(from var(--a),var(--ac),#fff,#222,var(--ac)) border-box;animation:spin 4s linear infinite,in .5s both;box-shadow:0 0 40px #9b8cff22}
.prize .gift{font-size:54px;display:inline-block;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.cd{display:flex;gap:8px;justify-content:center;margin:12px 0}.cd div{min-width:58px;background:var(--s2);border-radius:12px;padding:8px 4px}.cd b{display:block;font-size:24px;color:var(--ac);font-variant-numeric:tabular-nums}.cd small{color:var(--hint);font-size:11px}
.bar{height:10px;border-radius:9px;background:var(--s2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--ac);box-shadow:0 0 12px var(--ac);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.banner{display:block;width:100%;margin-top:6px;padding:10px 14px;border:1px solid #9b8cff55;border-radius:99px;background:linear-gradient(90deg,#9b8cff14,#9b8cff40,#9b8cff14);background-size:200% 100%;animation:mq 3s linear infinite;color:var(--tx);font:inherit;font-size:13px}@keyframes mq{to{background-position:-200% 0}}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 12px;border:1.5px solid var(--ln);border-radius:22px;background:var(--s1);color:var(--tx);font:inherit;transition:.25s;animation:in .5s both}.pick button:nth-child(2){animation-delay:.1s}.pick button b{font-size:44px;transition:.3s}.pick button:active{transform:scale(.95)}.pick button:hover{border-color:var(--ac);box-shadow:0 0 30px #9b8cff33}.pick button:hover b{transform:scale(1.15) rotate(-6deg)}.pick small{color:var(--hint)}
.seg{display:flex;gap:6px;margin:10px 0 2px;padding:4px;border-radius:99px;background:var(--s1);border:1px solid var(--ln)}.seg button{flex:1;padding:10px;border:0;border-radius:99px;background:none;color:var(--hint);font:inherit;font-weight:600;transition:.25s}.seg button.on{background:var(--ac);color:#101126;box-shadow:0 0 16px #9b8cff44}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:236px;overflow-y:auto;padding:4px;scrollbar-width:thin}

.stp div{display:flex;gap:10px;align-items:center;padding:7px 0}.stp b{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#101126;display:grid;place-items:center;flex:none}.big{font-size:44px;color:var(--ac);line-height:1}.mk{animation:in .35s both}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.kpi{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--s1),var(--s2));border:1px solid var(--ln);border-radius:var(--r);padding:14px;animation:in .5s both}.kpi i{position:absolute;right:10px;top:6px;font-size:30px;opacity:.25;font-style:normal}.kpi b{display:block;font-size:28px;color:var(--ac)}.kpi small{color:var(--hint)}
.chart{display:flex;gap:6px;align-items:flex-end;height:140px;padding-top:18px}.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.chart i{position:relative;width:100%;height:var(--h);min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--ac),#4d7a0a);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}.chart i b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--hint)}@keyframes grow{from{transform:scaleY(0)}}.chart small{font-size:10px;color:var(--hint)}
.adm-h{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px}.adm-h b{font-size:20px}.adm-h small{background:var(--ac);color:#101126;border-radius:99px;padding:3px 10px;font-weight:700}.lb em.done{color:var(--ac)}

/* ANONIM EMOJI — refreshed glass / aurora interface */
:root{
 --bg:#080914;--s1:#111426;--s2:#1a2038;--ln:#2b3453;--tx:#f5f6ff;--hint:#9ba5c5;
 --ac:#9b8cff;--r:20px;--btn:#9b8cff;--sec:#111426;--g:#9b8cff;
 color-scheme:dark;
}
html{background:var(--bg)}
body{background:radial-gradient(ellipse at 50% -12%,#40358b55 0,transparent 42%),radial-gradient(ellipse at 100% 42%,#176b8a22 0,transparent 38%),var(--bg);padding-left:16px;padding-right:16px}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.23;animation:aurora 12s ease-in-out infinite alternate}
body:before{width:230px;height:230px;left:-130px;top:22%;background:#7865ff}
body:after{width:210px;height:210px;right:-130px;top:62%;background:#16c7d8;animation-delay:-5s}
@keyframes aurora{to{transform:translate(55px,-35px) scale(1.22)}}
.grain{opacity:.035}
.top{padding:20px 2px 14px;gap:14px}
.top img{width:54px;height:54px;border:2px solid #a99cff;box-shadow:0 0 28px #9b8cff44}
.top b{font-size:18px;letter-spacing:.11em}
.top small{margin-top:3px;letter-spacing:.02em}
nav{bottom:calc(14px + env(safe-area-inset-bottom));padding:6px;background:#111629dd;border:1px solid #414b70;border-radius:22px;box-shadow:0 14px 45px #0009,0 0 24px #8b7cff18}
nav .pill{background:linear-gradient(120deg,#b3a8ff,#7b8cff);box-shadow:0 5px 18px #8878ff66}
nav button{padding:11px 13px;border-radius:16px;font-size:13px}
nav button.on{color:#101126}
section{animation:section-enter .48s cubic-bezier(.2,.8,.2,1)}
@keyframes section-enter{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.pick{gap:12px}
.pick button{border:1px solid #343d60!important;border-radius:22px!important;background:linear-gradient(145deg,#171d35,#101426)!important;box-shadow:0 12px 30px #0003;transition:transform .25s,border-color .25s,box-shadow .25s}
.pick button:active{transform:scale(.97)}
.pick button b{filter:drop-shadow(0 5px 12px #9b8cff55)}
.seg{padding:5px;border:1px solid var(--ln);border-radius:18px;background:#101528}
.seg button{border-radius:14px!important}
.stage{border-radius:30px!important;background:radial-gradient(circle at 30% 20%,#2a3152,#0a0d1b) padding-box,conic-gradient(from var(--a),#9b8cff,#56d6e8,#f3a7ff,#9b8cff) border-box!important;box-shadow:0 20px 55px #0006,0 0 38px #8878ff1c!important}
.card,.stats div{background:linear-gradient(145deg,#171d33ed,#101426ed);border:1px solid #303a5b;border-radius:20px;box-shadow:0 12px 30px #0002}
.card:hover{border-color:#9b8cff88;transform:translateY(-2px)}
input[type=text],input[type=number],select,textarea{background:#101629;border:1px solid #343e60;border-radius:16px;padding:14px 15px}
input:focus,select:focus,textarea:focus{border-color:#a99cff;box-shadow:0 0 0 4px #9b8cff20}
.chips button,.sub button{background:#141a30;border:1px solid #394365;border-radius:14px}
.chips button.on,.sub button.on{background:linear-gradient(120deg,#b4aaff,#8295ff);color:#101126;border-color:transparent;box-shadow:0 7px 20px #8878ff33}
.go{border-radius:17px;background:linear-gradient(110deg,#b9afff,#8e9cff 55%,#67d7e7);color:#101126;box-shadow:0 10px 28px #8377ff38;font-weight:850}
.go:after{background:linear-gradient(100deg,transparent,#ffffffa8,transparent)}
.btn2{border-color:#a99cff;color:#c3baff;border-radius:15px}
.ava{background:linear-gradient(135deg,#b9afff,#66d6e8);box-shadow:0 0 35px #9b8cff44}
.stats b,.lb em{color:#b7adff}
.tag{background:#252c49;border:1px solid #374263}
.dots i.on{background:#a99cff;box-shadow:0 0 14px #9b8cff}
.st i{background:linear-gradient(135deg,#b9afff,#7d92ff);color:#111329;box-shadow:0 0 16px #9b8cff44}
.lb{border-bottom-color:#29324e}
.lb:first-child span{color:#b7adff}
.lb.me2{background:#9b8cff16}
.prize{background:linear-gradient(#151a30,#151a30) padding-box,conic-gradient(from var(--a),#9b8cff,#56d6e8,#f3a7ff,#9b8cff) border-box}
.spot{background:radial-gradient(440px circle at var(--x,50%) var(--y,18%),#9b8cff18,transparent 70%)}
.cf{filter:drop-shadow(0 2px 5px #9b8cff55)}
@media(min-width:700px){body{max-width:620px;margin:0 auto}.top{padding-top:28px}.stage{max-width:340px}}
@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}}

/* ANONIM EMOJI opening screen */
#intro-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  overflow:hidden;background:#000;opacity:1;visibility:visible;
  transition:opacity .65s ease,visibility .65s ease}
#intro-screen::before{content:"";position:absolute;width:min(78vw,420px);aspect-ratio:1;
  border-radius:50%;background:radial-gradient(circle,#fff 0%,#aaa 13%,#555 28%,transparent 68%);
  filter:blur(42px);opacity:.16;animation:intro-aura 2.4s ease-in-out infinite alternate}
#intro-screen .intro-mark{position:relative;width:min(78vw,520px);height:auto;object-fit:contain;
  opacity:0;transform:translateY(24px) scale(.78);
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  animation:intro-reveal 1.15s cubic-bezier(.16,1,.3,1) .12s forwards,
            intro-float 2.1s ease-in-out 1.25s infinite}
#intro-screen .intro-ring{position:absolute;width:min(88vw,590px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(255,255,255,.16);transform:scale(.72);opacity:0;
  animation:intro-ring 1.45s ease-out .25s forwards}
#intro-screen .intro-caption{position:absolute;bottom:calc(12vh + env(safe-area-inset-bottom));
  color:rgba(255,255,255,.82);font:600 11px/1.2 system-ui,sans-serif;
  letter-spacing:.42em;text-indent:.42em;opacity:0;animation:intro-caption .7s ease 1s forwards}
#intro-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none}

function gate(e){const d=e.data||{};
 if(d.error==='maint'){document.body.innerHTML='<div class="card" style="margin-top:26vh;text-align:center"><h3>🛠 Ta\'mirlash ishlari</h3><small>Tez orada qaytamiz. Iltimos, keyinroq urinib ko\'ring.</small></div>';return}

 if(d.error==='subscribe'){document.body.innerHTML=`<div class="card" style="margin-top:12vh;text-align:center"><h3>${d.left?'⚠️ Siz kanaldan chiqib ketdingiz':'📢 Kanalga obuna bo\'ling'}</h3><small>${d.left?'Kanalga obuna bo\'ling, shunda botdan foydalana olasiz.':'Botdan foydalanish uchun quyidagi kanallarga a\'zo bo\'ling.'}</small><div style="margin-top:14px;display:grid;gap:8px">${d.channels.map(c=>`<button class="btn2" data-ch="${esc(c)}">${esc(c)}</button>`).join('')}<button class="go" id="re">✅ Tekshirish</button></div></div>`;
  document.body.onclick=ev=>{const c=ev.target.dataset.ch;if(c)tg.openTelegramLink('https://t.me/'+c.replace('@',''));if(ev.target.id==='re')location.reload()};return}
 document.body.innerHTML='<div class="card" style="margin-top:14vh;text-align:center"><h3>Serverga ulanib bo\'lmadi</h3><small>'+esc(e.message)+'</small><br><br><small>API manzil: '+esc(window.API_BASE||'(bo\'sh — config.js yozilmagan)')+'</small><br><br><button class="btn2" onclick="location.reload()">Qayta urinish</button></div>'}
const userCard=x=>`<div style="margin-top:12px"><b>${esc(x.name||"Noma'lum")}</b> ${x.username?'@'+esc(x.username):''}<br><small>id ${x.id}${x.started?'':" · botni ishga tushirmagan"}${x.admin?' · admin':''}</small>
<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div><b data-n="${x.packs}">${x.packs}</b><small>to'plam</small></div><div><b data-n="${x.stars}">${x.stars}</b><small>to'langan ⭐</small></div></div>
<small>${x.banned?'🚫 bloklangan':'✅ faol'}</small><br><button class="btn2" style="margin-top:10px" data-uact="${x.banned?'unban':'ban'}" data-uid="${x.id}">${x.banned?'Blokdan chiqarish':'Bloklash'}</button></div>`;
// ---------- Admin
async function adm(action,value,kind){try{return await api('/api/admin',{action,value,kind})}catch(e){tg.showAlert(e.message)}}
let aTab='stats',aData=null;
async function loadAdmin(a){aData=a||await adm('overview');if(aData)drawAdmin()}
function drawAdmin(){const a=aData,el=$('#admin');
 const tabs=[['stats','📊 Statistika'],['users','👥 Odamlar'],['cn','🏆 Konkurs'],['ch','📢 Kanallar'],['set','⚙️ Sozlama'],['msg','📣 Xabar']];
 const tag=(i,del)=>`<span class="tag">${i}<b data-del="${del}" data-v="${i}">×</b></span>`,none="<small>yo'q</small>";
 const lb=(l,k)=>l.map((x,i)=>`<div class="lb"><span>${i+1}</span><b>${esc(x.who)}</b><em>${x.n}${k}</em></div>`).join('')||none;
 const kpi=(ic,n,l)=>`<div class="kpi"><i>${ic}</i><b data-n="${n}">${n}</b><small>${l}</small></div>`,mx=Math.max(1,...a.chart.map(x=>x.n));
 let b='';
 if(aTab==='stats')b=`<div class="kpis">${kpi('👥',a.users,'foydalanuvchi')}${kpi('⚡',a.today,'bugun yasaldi')}${kpi('📦',a.packs_total,"jami to'plam")}${kpi('⭐',a.stars_total,'jami tushum')}</div>
 <div class="card"><h3>📈 7 kunlik faollik</h3><div class="chart">${a.chart.map(x=>`<div><i style="--h:${Math.round(x.n/mx*100)}%"><b>${x.n}</b></i><small>${x.d}</small></div>`).join('')}</div></div>
 <div class="card"><h3>🧾 So'nggi buyurtmalar</h3>${a.orders.map(o=>`<div class="lb"><span>${o.k==='logo'?'🎨':'✍️'}</span><b>id ${o.u}</b><em class="${o.s}">${o.p} ⭐ ${o.s==='done'?'✅':'⏳'}</em></div>`).join('')||none}</div>
 <div class="card"><h3>🏆 Eng ko'p yasaganlar</h3>${lb(a.top_packs,' ta')}</div><div class="card"><h3>💎 Eng ko'p to'laganlar</h3>${lb(a.top_stars,' ⭐')}</div>`;
 else if(aTab==='users')b=`<div class="card"><h3>🔎 Foydalanuvchini qidirish</h3><div class="row"><input type="number" id="u-id" placeholder="user_id"><button class="btn2" data-usearch="1">Qidirish</button></div><div id="u-res"></div></div><div class="card"><h3>🚫 Bloklanganlar</h3>${a.banned.map(i=>tag(i,'ban')).join('')||none}</div>${a.admins?`<div class="card"><h3>👑 Adminlar</h3>${a.admins.map(i=>tag(i,'admin')).join('')||none}<div class="row" style="margin-top:8px"><input type="number" id="a-admin" placeholder="user_id"><button class="btn2" data-add="admin">Qo'shish</button></div></div>`:''}`;
 else if(aTab==='cn'){const c=a.contest;b=`<div class="card"><h3>🏆 Konkurs</h3><div class="row" style="margin:8px 0"><span>Avtomatik konkurs (30 kun · 15 ⭐ · 5 ta)</span><div class="sw ${a.auto?'on':''}" data-auto="${a.auto?0:1}"></div></div>`+(c&&c.status==='active'?`<small>Tugaydi: ${new Date(c.end*1000).toLocaleString()}<br>Sovrin: ${c.prize} ⭐ · shart: kamida ${c.min} ta · ishtirokchilar: ${c.players}</small><button class="go" data-cstop="1">Hozir yakunlash</button>`:(c?`<small>Yakunlangan · g'olib: ${c.winner?'id '+c.winner:"yo'q"} · gift: ${c.gift_sent?'yuborilgan ✅':(c.winner?'yuborilmagan ⚠️ '+esc(c.note||''):'—')}</small>${c.winner&&!c.gift_sent?'<button class="go" data-cretry="1">Giftni qayta yuborish</button>':''}`:"<small>Hali konkurs yo'q</small>")+`<small style="display:block;margin-top:12px">Yangi konkurs: kun · gift ⭐ · minimal emoji</small><div class="row" style="margin-top:8px"><input type="number" id="cn-d" value="30" min="1"><input type="number" id="cn-p" value="15" min="1"><input type="number" id="cn-m" value="5" min="1"></div><button class="go" data-cstart="1">Konkursni boshlash</button>`)+`</div>`}
 else if(aTab==='ch')b=`<div class="card"><h3>📢 Majburiy kanallar</h3><small>Bot kanalda admin bo'lishi shart. O'chirish uchun «off» yozing.</small><textarea id="a-ch" rows="3" placeholder="@kanal1 @kanal2" style="margin-top:8px">${esc(a.channels)}</textarea><button class="go" data-save="channels">Saqlash</button></div>`;
 else if(aTab==='set')b=`<div class="card"><h3>💰 Narxlar (⭐)</h3>${['name','logo'].map(k=>`<div class="row" style="margin-top:8px"><span>${{name:'Ism emoji',logo:'Logo emoji'}[k]}</span><input type="number" min="1" value="${a.prices[k]}" data-price="${k}"><button class="btn2" data-save="${k}">OK</button></div>`).join('')}<small style="display:block;margin-top:8px">Narx o'zgarsa, log kanalga xabar boradi.</small></div><div class="card"><h3>💬 Yordam kontakti</h3><div class="row"><input type="text" id="a-sup" value="${esc(a.support)}"><button class="btn2" data-save="support">OK</button></div></div><div class="card"><div class="row"><div><h3>🛠 Ta'mirlash rejimi</h3><small>Yoqilsa, oddiy foydalanuvchilar botdan foydalana olmaydi.</small></div><div class="sw ${a.maint?'on':''}" data-maint="${a.maint?0:1}"></div></div></div>`;
 else b=`<div class="card"><h3>📣 Hammaga xabar</h3><small>${a.users} ta foydalanuvchiga yuboriladi (bloklanganlardan tashqari).</small><textarea id="a-msg" rows="5" maxlength="1000" placeholder="Xabar matni" style="margin-top:10px"></textarea><button class="go" data-bc="1">Yuborish</button></div>`;
 el.innerHTML=`<div class="adm-h"><b>🛠 Admin panel</b><small>${a.owner?'Egasi':'Admin'}</small></div><div class="sub">${tabs.map(t=>`<button data-at="${t[0]}" class="${aTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>${b}`;countUp(el)}
$('#admin').addEventListener('click',async e=>{const t=e.target.closest('[data-at],[data-del],[data-add],[data-save],[data-usearch],[data-uact],[data-bc],[data-cstart],[data-cstop],[data-cretry],[data-auto],[data-maint]');if(!t)return;const d=t.dataset;let r;hap();
 if(d.at){aTab=d.at;drawAdmin();return}
 if(d.del==='ban'){await adm('unban',d.v);return loadAdmin()}
 if(d.del)r=await adm(d.del+'_del',d.v);
 else if(d.add)r=await adm(d.add+'_add',$('#a-'+d.add).value);
 else if(['name','logo'].includes(d.save))r=await adm('price',$(`[data-price=${d.save}]`).value,d.save);
 else if(d.save==='channels')r=await adm('channels',$('#a-ch').value);
 else if(d.save==='support')r=await adm('support',$('#a-sup').value);
 else if(d.auto!==undefined)r=await adm('auto_set',d.auto);
 else if(d.maint!==undefined)r=await adm('maint_set',d.maint);
 else if(d.cstart)r=await adm('contest_start',$('#cn-d').value,$('#cn-p').value+':'+$('#cn-m').value);
 else if(d.cstop)return tg.showConfirm("Konkurs hozir yakunlanib, g'olib aniqlanadi. Davom etamizmi?",async ok=>{if(ok){const x=await adm('contest_stop');if(x){aData=x;drawAdmin()}}});
 else if(d.cretry)r=await adm('contest_retry');
 else if(d.usearch){const j=await adm('user_info',$('#u-id').value);if(j){$('#u-res').innerHTML=userCard(j.user);countUp($('#u-res'))}return}
 else if(d.uact){const j=await adm(d.uact,d.uid);if(j)$('#u-res').innerHTML=userCard(j.user);return}
 else if(d.bc){const x=$('#a-msg').value.trim();if(!x)return tg.showAlert('Xabar yozing');return tg.showConfirm(`Xabar ${aData.users} ta foydalanuvchiga yuboriladi. Davom etamizmi?`,async ok=>{if(ok&&await adm('broadcast',x)){$('#a-msg').value='';tg.showAlert('Yuborish boshlandi. Tugagach sizga xabar keladi.')}})}
 if(r){aData=r;drawAdmin();tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}});

 $('#l-go').onclick=()=>$('#l-text').value.trim()?order(logoBody(),$('#l-title').value,$('#l-go')):tg.showAlert('Matn yozing');
 if(cfg.contest){const T=CT[L],dl=Math.max(1,Math.ceil((cfg.contest.end-Date.now()/1000)/86400));$('#make').insertAdjacentHTML('afterbegin',`<button class="banner" id="cbn">${T.ban(cfg.contest.prize,dl)}</button>`);$('#cbn').onclick=()=>tab('rank')}
 prices();tr();requestAnimationFrame(pill);if(new URLSearchParams(location.search).get('tab')==='admin'&&cfg.admin)tab('admin')})();
